        run: |
          python3 - <<'PYRESTORE'
          import os, base64, io, hashlib, pathlib, zipfile
          blob = base64.b64decode(''.join(os.environ['BIOSYNC_ZIP_B64'].split()), validate=True)
          assert hashlib.sha256(blob).hexdigest() == '9dbbfdf1fafc797f89607b4d0c427507d5ed2462de823066655d13c12fdbc79f', 'ZIP checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(blob)) as zip_source:
              for part in zip_source.infolist():
                  rel = pathlib.PurePosixPath(part.filename)
                  if rel.is_absolute() or '..' in rel.parts:
                      raise RuntimeError('unsafe ZIP entry')
              zip_source.extractall('.')
          print('BioSync WAV Haptic v1.5 source restored successfully')
          PYRESTORE
      - name: Compile Android debug APK
        run: gradle --no-daemon --project-dir BioSync-WAV-Haptic-v1.5 assembleDebug
      - name: Publish APK in Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BioSync-WAV-Haptic-v1.5-APK
          path: BioSync-WAV-Haptic-v1.5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
