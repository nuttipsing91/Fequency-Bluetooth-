# BioSync WAV + Haptic v1.5 — OneFile APK Builder
# Create this EXACT repository path: .github/workflows/BioSync_WAV_Haptic_OneFile_APK_Builder.yml
# Contains entire source ZIP; no separate upload of code needed.
name: BioSync WAV Haptic OneFile APK Builder
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore project from embedded source
